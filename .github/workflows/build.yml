name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ShowdownKit
        working-directory: ShowdownKit
        run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Showdown.xcodeproj \
            -scheme Showdown \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -300 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Showdown.app Payload/
          zip -qry Showdown.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Showdown-ipa
          path: Showdown.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Showdown.ipa
          generate_release_notes: true
