name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ShowdownKit
        working-directory: ShowdownKit
        run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Showdown.xcodeproj \
            -scheme Showdown \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -300 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Showdown.app Payload/
          zip -qry Showdown.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Showdown-ipa
          path: Showdown.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Showdown.ipa
          generate_release_notes: true

  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          xcodebuild -project Showdown.xcodeproj -scheme Showdown -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build build > sim-build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim-build.log || true
          grep -q "BUILD SUCCEEDED" sim-build.log

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Showdown.app
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" io.github.gguthrie.showdown 2>/dev/null || true
            xcrun simctl launch "$UDID" io.github.gguthrie.showdown "$@"
            sleep 14
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shoot 1-home
          shoot 2-battle -demoBattle
          shoot 3-teams -demoTeams
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
